[package]
name = "streamtui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
data-encoding = "2.11.1"
dirs = "6.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "multipart", "http2", "charset", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "net", "fs", "signal", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.4"
